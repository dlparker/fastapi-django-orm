name: CI

on:
  push:
    branches:
      - main
      - '[0-9].[0-9]+'  # matches to backport branches, e.g. 3.6
    tags: [ 'v*' ]
    paths-ignore: [ "docs/**" ]
  pull_request:
    branches:
      - main
      - '[0-9].[0-9]+'
      - 'update/pre-commit-autoupdate'
    paths-ignore: [ "docs/**" ]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: testorm
          POSTGRES_USER: testorm
          POSTGRES_PASSWORD: testorm
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements/base.txt
          requirements/local.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        pip install -r requirements/local.txt "psycopg[binary]"
    - name: Test
      run: pytest tests/
      env:
        DATABASE_URL: postgres://testorm:testorm@localhost:5432/testorm
    - name: Type check
      run: mypy app config tests
